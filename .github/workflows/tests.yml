name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          # Optional: add GROQ_API_KEY as a repo secret (Settings -> Secrets
          # and variables -> Actions) to run the live router golden-set test
          # in tests/test_router.py. Without it, that tier skips cleanly and
          # everything else still runs.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest -v