name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          # Optional: add GROQ_API_KEY as a repo secret (Settings -> Secrets
          # and variables -> Actions) to run the live router golden-set test
          # in tests/test_router.py. Without it, that tier skips cleanly and
          # everything else still runs.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Exports the locked dependency set to a plain requirements list,
      # then audits THAT directly -- avoids pip-audit needing to
      # introspect a live Python environment at all. That's what broke
      # locally: pip-audit run via `uvx` audits uvx's own isolated tool
      # environment by default, not this project's venv, unless
      # PIPAPI_PYTHON_LOCATION is set to redirect it. A static
      # requirements export sidesteps that whole class of problem.
      - name: Export locked dependencies for audit
        run: uv export --frozen --no-dev --no-hashes -o requirements-audit.txt

      # Same idea as before: checks against the PyPI Advisory Database
      # (same source as Dependabot's own alerts), separate job so a
      # finding shows up as its own clearly-labeled failure. Active check
      # (fails the build on a real finding), not Dependabot's passive
      # "here's a PR eventually." Drop --strict (or add --ignore-vuln for
      # a specific ID with a comment explaining why) if this gets noisy
      # with findings that don't apply to how this app actually uses the
      # affected package.
      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit --strict -r requirements-audit.txt